name: Auto-refresh All-Style

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours; Style of the Day rolls over at 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "src/**"
      - "assets/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch headlines, heat index and videos
        run: python scripts/update.py

      - name: Rebuild every page
        run: python scripts/build.py

      - name: Commit and push
        id: commit
        run: |
          git config user.name "all-style-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Auto-refresh: $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Ask GitHub Pages to rebuild from main
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null 2>&1 && echo "Pages build requested." || echo "Pages build request skipped (Pages builds on push)."
